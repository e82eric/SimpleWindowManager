[package]
name = "simple-window-manager-rs"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
csv = "1"
crossbeam-channel = "0.5"
nfm-picker-sources = { git = "https://github.com/e82eric/npicker", rev = "1d1fa87bc9a165fbaf00fcd3c8d9ca3c8f5e1083" }
nfm-window-egui = { git = "https://github.com/e82eric/npicker", rev = "1d1fa87bc9a165fbaf00fcd3c8d9ca3c8f5e1083" }
nfm-process-egui = { git = "https://github.com/e82eric/npicker", rev = "1d1fa87bc9a165fbaf00fcd3c8d9ca3c8f5e1083" }
nfm-file-system-egui = { git = "https://github.com/e82eric/npicker", rev = "1d1fa87bc9a165fbaf00fcd3c8d9ca3c8f5e1083" }
nfm_file_system = { git = "https://github.com/e82eric/npicker", rev = "1d1fa87bc9a165fbaf00fcd3c8d9ca3c8f5e1083" }
nfm-egui = { git = "https://github.com/e82eric/npicker", rev = "1d1fa87bc9a165fbaf00fcd3c8d9ca3c8f5e1083", features = ["opengl"] }
nfm_search_core = { git = "https://github.com/e82eric/npicker", rev = "1d1fa87bc9a165fbaf00fcd3c8d9ca3c8f5e1083" }
nfm-win32 = { git = "https://github.com/e82eric/npicker", rev = "1d1fa87bc9a165fbaf00fcd3c8d9ca3c8f5e1083" }
nfm-preview-file = { git = "https://github.com/e82eric/npicker", rev = "1d1fa87bc9a165fbaf00fcd3c8d9ca3c8f5e1083" }
nfm-preview = { git = "https://github.com/e82eric/npicker", rev = "1d1fa87bc9a165fbaf00fcd3c8d9ca3c8f5e1083", features = ["egui"] }
serde_json = "1"
tracing = { version = "0.1", features = ["attributes"] }
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["json"] }
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_UI_WindowsAndMessaging",
] }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_UI_Input_Ime",
    "Win32_System_Memory",
    "Win32_System_DataExchange",
    "Win32_Graphics_OpenGL",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Time",
    "Win32_System_Services",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
strip = "symbols"
